services:
  ros2:
    build: .
    image: ros-jev:humble
    container_name: ros-jev
    working_dir: /ws/ROS-JEV
    # Mount the repo so edits on the Mac are visible inside the container
    volumes:
      - .:/ws/ROS-JEV
    # GUI apps (Gazebo, rviz2) render on the in-container display and are
    # viewed in a browser at http://localhost:6080/vnc.html
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:8080:8080"      # jev_ai dashboard (ros2 launch jev_ai_examples toy_patrol.launch.py)
    environment:
      # Gazebo GUI in a VM has no GPU; software rendering avoids GL failures
      - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_DOMAIN_ID=0
      # the dashboard has no auth: bind all interfaces inside the container only because
      # the port above is published on the host's loopback
      - JEV_AI_DASHBOARD_HOST=0.0.0.0
    # Stay running so you can attach shells with `docker compose exec`.
    # Gazebo and ROS nodes started in different shells share one container,
    # so they see each other's topics.
    command: sleep infinity

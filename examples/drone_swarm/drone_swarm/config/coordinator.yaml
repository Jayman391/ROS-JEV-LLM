# Drone swarm: the mission coordinator's catalog (DECISION_MODEL §3.2). Rules own the routine
# (phase advances, sector allocation, recalls need a cause); Jev + Sonnet judge what needs
# judgement: stopping the mission early, formation, risk, relays, track verdicts, report responses.
# `track` and `report` are per-item sets: the coordinator decides one item at a time and passes
# that item's own standing class as `current`.
catalog_version: 1
name: sar_coordinator
question_sets:
  global:
    state_keys: [mission, coverage, swarm, tracks, time_budget, comms, risk_events]
    tick_hz: 0.5
    augment: true
    questions:
      phase_transition:                              # C1 (advancing is a rule; this stops early)
        type: choice
        instructions: "Should the swarm stop the mission early? Phases advance on their own when their work is done or their time is up."
        act: sample
        classes:
          - {name: stay, criteria: "Carry on with the mission.", reversible: true}
          - {name: recover_all, criteria: "Stop searching and bring every drone home now; the remaining work is not worth the risk.", reversible: false}
          - {name: abort, criteria: "Recall everything immediately; only for a mission-threatening situation.", reversible: false}
        fallback: stay
        tau: 0.3
      transit_formation:                             # C2
        type: choice
        instructions: "Which formation should the swarm fly in transit?"
        act: sample
        classes:
          - {name: column, reversible: true}
          - {name: line, reversible: true}
          - {name: v, reversible: true}
          - {name: diamond, reversible: true}
          - {name: circle, reversible: true}
        fallback: column
        tau: 0.5
      mission_risk:                                  # C5
        type: score
        instructions: "How much risk is the mission in right now (losing drones, missing survivors, running out of time)?"
        classes: [{name: low}, {name: moderate}, {name: elevated}, {name: severe}]
        act: expectation
      relay_needed:                                  # C8
        type: noul
        instructions: "Is a relay drone needed to keep a far sector in contact?"
        criteria: {"true": "A sector's link is poor enough that reports are being lost.", "false": "Links are adequate."}
        act: threshold
        threshold: 0.5
    llm:
      system: "You are {agent}, the mission coordinator of a search-and-rescue drone swarm. Maximise confirmed survivors and area coverage within the mission clock, recover every drone safely, and spend LLM effort only where it changes outcomes."
  track:
    state_keys: [mission, track, evidence, nearby, inspection]
    tick_hz: 0
    augment: true
    questions:
      track_verdict:                                 # C3
        type: choice
        instructions: "What should be done with this fused detection track?"
        act: sample
        classes:
          - {name: await_data, criteria: "Wait for more sightings.", reversible: true}
          - {name: confirm_survivor, criteria: "Confirmed: a survivor (low-altitude evidence required).", reversible: false}
          - {name: confirm_non_survivor, criteria: "Confirmed: a real object that is not a survivor.", reversible: false}
          - {name: request_inspection, criteria: "Send a drone down to look closely.", reversible: true}
          - {name: dismiss, criteria: "A false alarm; stop tracking it.", reversible: true}
        fallback: await_data
        skip_llm_above_c: 0.3        # Sonnet only on uncertain verdicts; confirmations always ask
        tau: 0.3
    llm:
      system: "You are {agent}, the mission coordinator of a search-and-rescue drone swarm, judging one detection track. Confirm only with low-altitude evidence; a missed survivor is far worse than an extra inspection."
  report:
    state_keys: [mission, report, sender, sector]
    tick_hz: 0
    augment: true
    questions:
      report_response:                               # C4
        type: choice
        instructions: "How should the coordinator respond to this drone's report?"
        act: sample
        classes:
          - {name: acknowledge, criteria: "Nothing to change.", reversible: true}
          - {name: dispatch_support, criteria: "Send another drone to help.", reversible: true}
          - {name: reassign_sector, criteria: "Hand the sender's unfinished sector to other drones.", reversible: true}
          - {name: recall_drone, criteria: "Bring the sender home (only offered when its energy is short or it has a fault).", reversible: true}
        fallback: acknowledge
        skip_llm_above_c: 0.3
        tau: 0.5
    llm:
      system: "You are {agent}, the mission coordinator of a search-and-rescue drone swarm, answering one drone's report."
policy:
  T_dwell: 1.0                   # per-item sets switch items quickly
  T_refresh: 30.0
  k_max: 4                       # augmentations/min (DECISION_MODEL §6)
  llm_timeout: 15.0              # wall s
  T_wait: 30.5                   # sim s: llm_timeout x scenario real_time_factor (2) + 0.5
  ask_jev: change                # global (0.5 Hz): only when the encoded state's words change

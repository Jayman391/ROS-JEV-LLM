# Drone swarm scenario (SYSTEM_MODEL §8): one parameter file for every node, C++ and Python.
# Python reads the same file (drone_swarm.scenario.load). World frame: ENU, metres, base at origin.
/**:
  ros__parameters:
    num_drones: 8                 # workers, one sector each; plus num_drones // 4 relays
    seed: 0                       # episode seed: targets, wind, visibility, faults
    t_max_s: 900.0                # sim s (survey ~420 s + transit, confirm, recover)
    real_time_factor: 2.0         # sim s per wall s; LLM latency is wall time (see catalogs' T_wait)
    # Gazebo publishes /clock every step and every rclpy node pays for each message: 4 ms reached
    # only 1.6-1.8x with 8 drones (/clock 430 Hz wall); 8 ms holds 2.0x, flight unchanged
    # (TRANSIT 35 s, no separation breaches)
    physics_step_s: 0.008
    # 8 strips of 72 m = 4 lanes at alt_survey 20 m (lane_spacing 18.5 m)
    ao: [20.0, 420.0, -288.0, 288.0]      # x_min, x_max, y_min, y_max
    pad_spacing: 8.0              # landing spots along y (2·d_sep: neighbours never trip H4)
    cell_m: 10.0                  # coverage grid
    num_targets: 24               # same density as 10 in 300x300 m
    num_survivors: 8
    wind_max: 4.0                 # m/s; episode wind is uniform in [0, wind_max]
    faults: true                  # inject 0-2 faults per episode
    # static world (fixed per world file): vertical cylinders x, y, radius, height
    obstacles: [100.0, 115.0, 6.0, 40.0,  193.0, -173.0, 5.0, 35.0,  287.0, 58.0, 8.0, 25.0,
                353.0, -77.0, 4.0, 45.0,  140.0, -38.0, 5.0, 20.0,  393.0, 211.0, 6.0, 38.0,
                90.0, -240.0, 5.0, 30.0,  170.0, 250.0, 6.0, 40.0,  240.0, -260.0, 5.0, 35.0,
                210.0, 140.0, 7.0, 30.0,  330.0, -150.0, 6.0, 42.0,  380.0, -260.0, 4.0, 28.0,
                60.0, 220.0, 5.0, 25.0,  260.0, -120.0, 5.0, 32.0]
    nfz: [233.0, 192.0, 20.0,  313.0, -211.0, 18.0,  110.0, -150.0, 18.0,  340.0, 30.0, 20.0]
    # vehicle (§3)
    v_max_h: 7.0                  # headroom over v_survey for the safety filter
    v_max_up: 2.0
    v_max_down: 1.5
    a_max: 2.0
    yaw_rate_max: 1.0
    v_survey: 6.0                 # (user, 2026-10-11) a strip in ~300 s; p_detect 0.40/frame-pass
    v_transit: 5.0
    v_inspect: 2.0
    alt_survey: 20.0              # fixed (not in the LLM plan): p_detect 0.52/pass vs 0.33 at 30 m
    alt_transit: 40.0             # worker k cruises at alt_transit + d_sep * (k % 4)
    alt_relay: 56.0               # above every obstacle (45 m) and transit layer (52 m)
    alt_inspect: 10.0
    alt_min: 5.0
    alt_max: 60.0
    # energy (§3.1)
    E_0: 90.0                     # Wh (~1,300 s at survey speed: a strip + inspections + reserve)
    P_hover: 180.0                # W
    k_h: 2.0
    k_c: 25.0
    k_w: 1.5
    reserve: 0.10
    E_land_wh: 0.3
    # detector (§4.6)
    det_fov_deg: 60.0
    det_p0: 0.9
    det_h_opt: 15.0
    det_sigma_h: 15.0
    det_v_blur: 8.0
    det_lambda_fp: 0.02
    # comms (§4.8)
    R_c: 250.0
    link_slope: 20.0
    latency_ms: 50.0
    latency_jitter_ms: 200.0
    relay_uplink_q: 0.7           # a relay stays where its own link to the base is good
    leash_q: 0.3                  # a worker inspects on its own only where q >= this
    # safety (§7.1)
    d_sep: 4.0
    obstacle_clear: 3.0
    nfz_buffer: 5.0
    lost_link_hold_s: 10.0
    lost_link_rtb_s: 30.0
    # scoring (§6)
    w_R: 0.40
    w_P: 0.20
    w_C: 0.20
    w_T: 0.10
    w_E: 0.10
    w_usd: 10.0

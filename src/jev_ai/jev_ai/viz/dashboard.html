<!doctype html>
<!--
  jev_ai decision dashboard (FRAMEWORK §3, §5.3, §6, §12; phases A5 + A5.5).
  One self-contained page: no CDN, no web fonts, vanilla JS + inline SVG.
  Data modes:
    static: the <script id="jev-data"> tag holds the payload (python3 -m jev_ai.viz.report)
    live:   the tag holds null and the page polls /api/state every second (dashboard node)
  Payload: {mode, generated_at, records: [DecisionRecord dicts], diagnostics: {name: status},
            metrics: jev_ai.core.metrics.compute(...)}
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jev_ai decisions</title>
<link rel="icon" href="data:,">
<style>
/* ---- tokens: light, then dark (selected steps, not an automatic flip) ---- */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #75736d;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --jev: #2a78d6; --llm: #eb6834; --fused: #1baf7a;
  --o-COMMITTED: #2a78d6; --o-KEPT: #1baf7a; --o-REVISED: #6250d6; --o-LLM_MISSING: #eda100;
  --o-FALLBACK: #e34948; --o-FORCED: #e87ba4; --o-OPEN: #a9a79f; --o-PROVISIONAL: #a9a79f;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --good-text: #006300;
  --accent: #2a78d6;
  /* categorical: a question's classes, in catalog order */
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #6250d6; --c4: #e3a300; --c5: #e87ba4;
  --c6: #2aa9b8; --c7: #8a897f;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242423;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #9a988f;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --jev: #3987e5; --llm: #d95926; --fused: #199e70;
    --o-COMMITTED: #3987e5; --o-KEPT: #199e70; --o-REVISED: #9085e9; --o-LLM_MISSING: #c98500;
    --o-FALLBACK: #e66767; --o-FORCED: #d55181; --o-OPEN: #6b6a64; --o-PROVISIONAL: #6b6a64;
    --good-text: #0ca30c; --accent: #3987e5;
    --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #9085e9; --c4: #c98500; --c5: #d55181;
    --c6: #2196a6; --c7: #77766d;
  }
}

/* ---- page ---- */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: 0 16px 48px; max-width: 1280px; margin: 0 auto; overflow-x: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 16px 0 8px; }
h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
h3 { font-size: 13px; margin: 0; font-weight: 600; }
.sub { color: var(--ink-2); font-size: 12.5px; margin: 0 0 10px; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.status { font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.spacer { flex: 1; }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis);
  border-radius: 6px; padding: 4px 8px; }
.panel { background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring);
  padding: 14px 16px; min-width: 0; }
.grid { display: grid; gap: 12px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.section { margin: 18px 0 8px; }
.empty { color: var(--muted); padding: 24px 8px; text-align: center; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
  padding: 1px 8px 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--ink);
  white-space: nowrap; }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2);
  color: var(--ink-2); white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.hidden { display: none !important; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
tbody th { width: 1%; white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }

/* ---- tooltip ---- */
#tip { position: fixed; z-index: 10; pointer-events: none; max-width: 300px; background: var(--ink);
  color: var(--page); font-size: 12px; padding: 6px 9px; border-radius: 6px; opacity: 0;
  transition: opacity .08s; white-space: pre-line; }

/* ---- live: health, timeline, cards ---- */
.health { grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); }
.health .panel { padding: 10px 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12.5px; margin-top: 6px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.strip { display: flex; flex-wrap: wrap; gap: 2px; }
.strip button { width: 12px; height: 20px; border: 0; border-radius: 3px; padding: 0; cursor: pointer; }
.strip button.sel { outline: 2px solid var(--ink); outline-offset: 1px; }

/* ---- detail ---- */
.detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.path { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 8px 0; font-size: 12px; color: var(--muted); }
.qgrid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); margin-top: 12px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 10px; }
.crow { display: grid; grid-template-columns: minmax(70px, 30%) 1fr; gap: 8px; align-items: center;
  padding: 5px 0; border-top: 1px solid var(--grid); }
.crow:first-of-type { border-top: 0; }
.cname { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.cname .marks { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; font-weight: 500; }
.cname.masked { color: var(--muted); text-decoration: line-through; }
.bars { display: grid; gap: 2px; }
.bar { display: flex; align-items: center; gap: 6px; height: 10px; font-size: 11px; color: var(--ink-2);
  font-variant-numeric: tabular-nums; }
.bar > i { display: block; height: 8px; border-radius: 0 4px 4px 0; min-width: 1px; }
.bar.none > i { background: transparent !important; }
.rationale { margin-top: 12px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; font-size: 13px; }

/* ---- metrics ---- */
.kpis { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); }
@media (max-width: 600px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi .value { font-size: 22px; } }
.kpi { padding: 12px 14px; }
.kpi .label { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.kpi .value { font-size: 26px; font-weight: 650; margin: 2px 0 0; letter-spacing: -0.01em; }
.kpi .ctx { font-size: 12px; color: var(--muted); }
.info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%;
  font-size: 10px; font-weight: 700; color: var(--muted); box-shadow: inset 0 0 0 1px var(--axis); cursor: help; flex: none; }
.chart { display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ax { stroke: var(--axis); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: var(--ring); }
.chart .lbl { fill: var(--ink-2); font-weight: 600; }
.hb { display: grid; grid-template-columns: minmax(70px, 34%) 1fr; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.hb .track { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
.hb .track i { display: block; height: 12px; border-radius: 0 4px 4px 0; min-width: 1px; }
.hb .name { overflow-wrap: anywhere; }
.qtitle { font-size: 12px; color: var(--muted); font-weight: 600; margin: 10px 0 4px; }
.qtitle:first-child { margin-top: 0; }

/* ---- mission-first layout: sticky summary bar + collapsible sections (native <details>) ---- */
.summary { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 8px 0 10px;
  display: flex; flex-wrap: wrap; gap: 6px 8px; border-bottom: 1px solid var(--grid); margin-bottom: 6px; }
.summary .pill { background: var(--surface); box-shadow: 0 0 0 1px var(--ring); border-radius: 8px;
  padding: 4px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.summary .pill b { font-weight: 650; margin-right: 4px; }
details.sec { background: var(--surface); border-radius: 10px; box-shadow: 0 0 0 1px var(--ring); margin: 8px 0;
  scroll-margin-top: 72px; }   /* clear of the sticky summary bar */
details.sec > summary { cursor: pointer; padding: 10px 14px; display: flex; align-items: baseline; gap: 10px;
  list-style: none; min-width: 0; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: '▸'; color: var(--muted); display: inline-block; transition: transform .1s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary .title { font-size: 14px; font-weight: 600; white-space: nowrap; }
details.sec > summary .sum { color: var(--ink-2); font-size: 12.5px; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.sec > .body { padding: 0 14px 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 2px 0 10px; }
tr.click { cursor: pointer; }
tr.click:hover > *, tr.sel > * { background: var(--surface-2); }
.ebar { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--grid);
  vertical-align: middle; margin-right: 6px; overflow: hidden; }
.ebar > i { display: block; height: 100%; }

/* ---- metrics: per-question rows (100% class bar + behaviour meters) ---- */
.qrow { display: grid; grid-template-columns: minmax(110px, 20%) 1fr; gap: 4px 14px; padding: 10px 0;
  border-top: 1px solid var(--grid); }
.qrow:first-child { border-top: 0; padding-top: 0; }
@media (max-width: 600px) { .qrow { grid-template-columns: 1fr; } }
.stack { display: flex; height: 18px; border-radius: 4px; overflow: hidden; gap: 2px; }
.stack > i { min-width: 2px; color: #fff; font: 600 11px/18px system-ui, sans-serif; font-style: normal;
  padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meters { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.meter { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; cursor: help; }
.meter > b { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.meter > b > i { display: block; height: 100%; background: var(--accent); }
details.more > summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; padding: 8px 0; }

/* ---- comms: hierarchy traffic (directives down, reports up) ---- */
.lanes .hit { cursor: pointer; }
td.dl { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.pay { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>jev_ai</h1>
  <span class="status" id="status"></span>
</header>
<div class="summary" id="summary"></div>

<main>
  <!-- sections are <details>, built by sec(): groups of like statuses (e.g. drones) as tables,
       the app's other statuses, then decisions, servers and metrics. Closed ones aren't rendered. -->
  <div id="s-fleet"></div>
  <div id="s-apps"></div>
  <div id="s-fixed"></div>
</main>
<div id="tip" role="tooltip"></div>

<script type="application/json" id="jev-data">null</script>
<script>
'use strict';
// ======================================================================= state & helpers
const OUTCOMES = ['COMMITTED', 'KEPT', 'REVISED', 'LLM_MISSING', 'FALLBACK', 'FORCED', 'OPEN'];
const OUTCOME_LABEL = {COMMITTED: 'Committed (no LLM asked)', KEPT: 'Kept after LLM',
  REVISED: 'Revised by LLM', LLM_MISSING: 'LLM missing (Jev only)', FALLBACK: 'Fallback',
  FORCED: 'Forced by app', OPEN: 'Open / superseded'};
const PHASE_HELP = {PROVISIONAL: 'Acted on Jev + noise; waiting for the LLM',
  REVISED: 'LLM changed the pick', KEPT: 'LLM agreed; pick kept', COMMITTED: 'Final',
  FALLBACK: 'Catalog fallback (timeout on irreversible, or Jev down)', FORCED: 'require() decided'};
const S = {data: null, qs: '', agent: '', outcome: '', sel: null, pinned: null, live: false,
           lastOk: 0, metricsStamp: null, error: '', cAgent: '', cDir: '', cStatus: '', cKind: ''};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// record strings (e.g. phase) reach style="" through oc(): keep only identifier characters
const css = (v) => `var(--${String(v).replace(/[^\w-]/g, '')})`;
const oc = (o) => css('o-' + o);
const t = (st) => st ? st.sec + st.nanosec * 1e-9 : 0;
const wall = (r) => t(r.wall_stamp) || t(r.header && r.header.stamp);
const isNum = (x) => typeof x === 'number' && isFinite(x);
const pct = (x, d = 1) => isNum(x) ? (x * 100).toFixed(d) + '%' : '–';
const fix = (x, d = 2) => isNum(x) ? x.toFixed(d) : '–';
const ms = (x) => !isNum(x) ? '–' : x >= 1000 ? (x / 1000).toFixed(2) + ' s' : Math.round(x) + ' ms';
const usd = (x) => !isNum(x) ? '–' : x >= 100 ? '$' + x.toFixed(0) : x >= 1 ? '$' + x.toFixed(2) : '$' + x.toFixed(3);
const compact = (x) => !isNum(x) ? '–' : Math.abs(x) >= 1e6 ? (x / 1e6).toFixed(1) + 'M'
  : Math.abs(x) >= 1e3 ? (x / 1e3).toFixed(1) + 'K' : String(Math.round(x * 100) / 100);
function ago(s) {
  if (!isNum(s)) return '–';
  s = Math.max(0, s);
  return s < 60 ? Math.round(s) + ' s' : s < 3600 ? Math.round(s / 60) + ' min'
    : s < 86400 ? (s / 3600).toFixed(1) + ' h' : Math.round(s / 86400) + ' d';
}
const hhmm = (sec) => new Date(sec * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
const hhmmss = (sec) => new Date(sec * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
const argmax = (v) => v.reduce((b, x, i) => (isNum(x) && (b < 0 || x > v[b]) ? i : b), -1);
function softmax(z) {
  const f = z.map((x) => isNum(x) ? x : null), m = Math.max(...f.filter((x) => x !== null));
  if (!isFinite(m)) return z.map(() => 1 / z.length);
  const e = f.map((x) => x === null ? 0 : Math.exp(x - m)), s = e.reduce((a, b) => a + b, 0);
  return e.map((x) => x / s);
}
function help(key) { return (S.data && S.data.metrics && S.data.metrics.help || {})[key] || {}; }
function info(key) {
  const h = help(key);
  return h.desc ? `<span class="info" data-tip="${esc(h.desc)}" aria-label="${esc(h.desc)}">i</span>` : '';
}

// ======================================================================= decisions (mirrors metrics.py)
function outcome(phases) {
  const last = phases[phases.length - 1];
  if (last === 'FORCED' || last === 'FALLBACK') return last;
  if (phases.includes('REVISED')) return 'REVISED';
  if (last === 'KEPT') return 'KEPT';
  if (last === 'COMMITTED') return phases.includes('PROVISIONAL') ? 'LLM_MISSING' : 'COMMITTED';
  return 'OPEN';
}
function decisions(records) {
  const by = new Map();
  for (const r of records) {
    const k = [r.run_id, r.agent, r.question_set, r.decision_id].join('|');
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(r);
  }
  const out = [];
  for (const [key, rs] of by) {
    rs.sort((a, b) => wall(a) - wall(b));
    out.push({key, records: rs, final: rs[rs.length - 1], outcome: outcome(rs.map((r) => r.phase)),
              t0: wall(rs[0]), t1: wall(rs[rs.length - 1])});
  }
  return out.sort((a, b) => a.t0 - b.t0);
}

// ======================================================================= tooltip
const tip = $('tip');
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip.style.opacity = 0; return; }
  tip.textContent = el.getAttribute('data-tip');
  tip.style.opacity = 1;
});
document.addEventListener('mousemove', (e) => {
  if (tip.style.opacity !== '1') return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
});

// ======================================================================= svg chart kit
function niceTicks(max, n = 4) {
  if (!(max > 0)) return [0, 1];
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * p).find((s) => s >= raw);
  const ticks = [];
  for (let v = 0; v < max + step * 0.999; v += step) ticks.push(+v.toPrecision(12));
  return ticks;
}
// Column with a 4px rounded data-end, square at the baseline.
function col(x, y, w, h, fill, tipText) {
  if (h <= 0) return '';
  const r = Math.min(4, h, w / 2);
  const d = `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  return `<path d="${d}" fill="${fill}"${tipText ? ` data-tip="${esc(tipText)}"` : ''}/>`;
}
function yAxis(ticks, y, l, r, fmt) {
  return ticks.map((v) => `<line class="gl" x1="${l}" x2="${r}" y1="${y(v)}" y2="${y(v)}"/>` +
    `<text x="${l - 6}" y="${y(v) + 3.5}" text-anchor="end">${esc(fmt(v))}</text>`).join('');
}
function width(el) { return Math.max(260, el.clientWidth || 320); }

// Histogram from metrics.histogram {edges, counts}. opts: color, fmtX, unit, markers [{x, label}]
function histogram(el, hist, opts = {}) {
  const n = hist && hist.counts ? hist.counts.reduce((a, b) => a + b, 0) : 0;
  if (!n) { el.innerHTML = `<div class="empty">${esc(opts.empty || 'No data yet.')}</div>`; return; }
  const W = width(el), H = 170, L = 40, R = 10, T = 14, B = 24;
  const {edges, counts} = hist, k = counts.length, bw = (W - L - R) / k;
  const ticks = niceTicks(Math.max(...counts)), top = ticks[ticks.length - 1];
  const y = (v) => T + (H - T - B) * (1 - v / top), x = (v) => L + (v - edges[0]) / (edges[k] - edges[0]) * (W - L - R);
  const fx = opts.fmtX || ((v) => fix(v, 1));
  let s = yAxis(ticks, y, L, W - R, compact);
  const bar = Math.min(24, Math.max(2, bw - 2));
  counts.forEach((c, i) => {
    const x0 = L + i * bw, tipText = `${fx(edges[i])} – ${fx(edges[i + 1])}${opts.unit || ''}\n${c} (${pct(c / n)})`;
    s += col(x0 + (bw - bar) / 2, y(c), bar, y(0) - y(c), opts.color || css('accent'));
    s += `<rect class="hit" x="${x0}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(tipText)}"/>`;
  });
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  const every = Math.ceil(k / Math.max(2, Math.floor((W - L - R) / 56)));
  for (let i = 0; i <= k; i += every)
    s += `<text x="${x(edges[i])}" y="${H - 6}" text-anchor="middle">${esc(fx(edges[i]))}</text>`;
  (opts.markers || []).filter((m) => isNum(m.x)).forEach((m, i) => {
    const mx = Math.min(W - R, x(m.x));
    s += `<line x1="${mx}" x2="${mx}" y1="${T - 4}" y2="${y(0)}" stroke="var(--ink-2)" stroke-width="1"/>` +
      `<text class="lbl" x="${mx + 3}" y="${T - 4 + i * 12}">${esc(m.label)}</text>`;
  });
  el.innerHTML = `<svg class="chart" width="${W}" height="${H}" role="img" aria-label="${esc(opts.aria || 'histogram')}">${s}</svg>`;
}

// Stacked columns of outcomes per time bucket (metrics phases.over_time).
function stacked(el, over) {
  if (!over || !Object.keys(over.series).length) { el.innerHTML = '<div class="empty">No decisions yet.</div>'; return; }
  const keys = OUTCOMES.filter((o) => over.series[o]);
  const k = over.series[keys[0]].length;
  const tot = Array.from({length: k}, (_, i) => keys.reduce((a, o) => a + over.series[o][i], 0));
  const W = width(el), H = 190, L = 40, R = 10, T = 10, B = 24, bw = (W - L - R) / k;
  const ticks = niceTicks(Math.max(...tot)), top = ticks[ticks.length - 1];
  const y = (v) => T + (H - T - B) * (1 - v / top);
  let s = yAxis(ticks, y, L, W - R, compact);
  const bar = Math.min(24, Math.max(2, bw - 2));
  for (let i = 0; i < k; i++) {
    let acc = 0;
    const x0 = L + i * bw + (bw - bar) / 2, t0 = over.t0 + i * over.bucket_s;
    const lines = [`${hhmmss(t0)} – ${hhmmss(t0 + over.bucket_s)}: ${tot[i]} decisions`];
    keys.forEach((o, j) => {
      const v = over.series[o][i];
      if (!v) return;
      lines.push(`${OUTCOME_LABEL[o]}: ${v}`);
      const y1 = y(acc + v), y0 = y(acc), gap = acc > 0 ? 2 : 0;   // 2px surface gap between segments
      const isTop = keys.slice(j + 1).every((o2) => !over.series[o2][i]);
      s += isTop ? col(x0, y1, bar, y0 - y1 - gap, oc(o))
        : `<rect x="${x0}" y="${y1}" width="${bar}" height="${Math.max(0, y0 - y1 - gap)}" fill="${oc(o)}"/>`;
      acc += v;
    });
    s += `<rect class="hit" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" data-tip="${esc(lines.join('\n'))}"/>`;
  }
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  const every = Math.ceil(k / Math.max(2, Math.floor((W - L - R) / 60)));
  for (let i = 0; i < k; i += every)
    s += `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${hhmm(over.t0 + i * over.bucket_s)}</text>`;
  el.innerHTML = `<svg class="chart" width="${W}" height="${H}" role="img" aria-label="Decisions over time by outcome">${s}</svg>`;
}

// Line with a soft area wash, end label and a hover crosshair. pts: [[t, v], ...]
function line(el, pts, opts = {}) {
  if (!pts || pts.length < 2) { el.innerHTML = `<div class="empty">${esc(opts.empty || 'Not enough data yet.')}</div>`; return; }
  const W = width(el), H = 170, L = 46, R = 56, T = 12, B = 24;
  const t0 = pts[0][0], t1 = pts[pts.length - 1][0], vmax = Math.max(...pts.map((p) => p[1]));
  const ticks = niceTicks(vmax), top = ticks[ticks.length - 1];
  const x = (v) => L + (t1 > t0 ? (v - t0) / (t1 - t0) : 0) * (W - L - R), y = (v) => T + (H - T - B) * (1 - v / top);
  const fmt = opts.fmt || compact;
  let s = yAxis(ticks, y, L, W - R, fmt);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  s += `<path d="${d}L${x(t1)},${y(0)}L${x(t0)},${y(0)}Z" fill="${opts.color}" opacity="0.1"/>`;
  s += `<path d="${d}" fill="none" stroke="${opts.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length - 1];
  s += `<circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="${opts.color}" stroke="var(--surface)" stroke-width="2"/>`;
  s += `<text class="lbl" x="${x(last[0]) + 8}" y="${y(last[1]) + 4}">${esc(fmt(last[1]))}</text>`;
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  [t0, (t0 + t1) / 2, t1].forEach((v, i) =>
    s += `<text x="${x(v)}" y="${H - 6}" text-anchor="${['start', 'middle', 'end'][i]}">${hhmm(v)}</text>`);
  s += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${y(0)}" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>`;
  s += `<circle class="xd" r="4" fill="${opts.color}" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
  s += `<rect class="ov" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  el.innerHTML = `<svg class="chart" width="${W}" height="${H}" role="img" aria-label="${esc(opts.aria || 'line chart')}">${s}</svg>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh'), xd = svg.querySelector('.xd');
  svg.querySelector('.ov').addEventListener('mousemove', (e) => {
    const px = e.clientX - svg.getBoundingClientRect().left;
    const tt = t0 + (px - L) / (W - L - R) * (t1 - t0);
    let best = pts[0];
    for (const p of pts) if (Math.abs(p[0] - tt) < Math.abs(best[0] - tt)) best = p;
    xh.setAttribute('x1', x(best[0])); xh.setAttribute('x2', x(best[0])); xh.setAttribute('visibility', 'visible');
    xd.setAttribute('cx', x(best[0])); xd.setAttribute('cy', y(best[1])); xd.setAttribute('visibility', 'visible');
    tip.textContent = `${hhmmss(best[0])}\n${opts.label || ''} ${fmt(best[1])}`; tip.style.opacity = 1;
  });
  svg.querySelector('.ov').addEventListener('mouseleave', () => {
    xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); tip.style.opacity = 0;
  });
}

// Reliability diagram: predicted top-class probability vs observed accuracy, per source.
const SOURCES = [['jev', 'Jev', 'jev'], ['llm', 'LLM', 'llm'], ['fused', 'Fused', 'fused']];
function reliability(el, cal) {
  const W = Math.min(width(el), 420), H = Math.min(W, 300), L = 40, R = 12, T = 10, B = 30;
  const x = (v) => L + v * (W - L - R), y = (v) => T + (H - T - B) * (1 - v);
  let s = '';
  [0, 0.25, 0.5, 0.75, 1].forEach((v) => {
    s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`;
    s += `<text x="${x(v)}" y="${H - 14}" text-anchor="middle">${v}</text>`;
  });
  s += `<text x="${(L + W - R) / 2}" y="${H}" text-anchor="middle">predicted probability of top class</text>`;
  s += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(1)}" y2="${y(1)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  for (const [k, name, c] of SOURCES) {
    const r = cal[k];
    if (!r || !r.n) continue;
    const bins = r.bins.filter((b) => b.n > 0);
    s += `<path d="${bins.map((b, i) => `${i ? 'L' : 'M'}${x(b.conf)},${y(b.acc)}`).join('')}" fill="none" stroke="${css(c)}" stroke-width="2" stroke-linejoin="round"/>`;
    bins.forEach((b) => s += `<circle cx="${x(b.conf)}" cy="${y(b.acc)}" r="${b.n >= 10 ? 4.5 : 3}" fill="${css(c)}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(`${name}: predicted ${pct(b.conf)}, right ${pct(b.acc)} of the time\n${b.n} decisions in bin ${b.lo.toFixed(1)}–${b.hi.toFixed(1)}`)}"/>`);
  }
  return `<svg class="chart" width="${W}" height="${H + 4}" role="img" aria-label="Reliability diagram">${s}</svg>`;
}

// HTML horizontal bars: rows [{name, value, label, tip, color}], max
function hbars(rows, max, color) {
  return `<div class="hb">${rows.map((r) => `<div class="name">${esc(r.name)}</div>
    <div class="track" data-tip="${esc(r.tip || '')}"><i style="width:${max > 0 ? Math.max(0.5, 100 * r.value / max) * 0.7 : 0}%;background:${r.color || color}"></i>${esc(r.label)}</div>`).join('')}</div>`;
}
function legend(items) {
  return `<div class="legend">${items.map(([c, l]) => `<span><i class="sw" style="background:${c}"></i>${esc(l)}</span>`).join('')}</div>`;
}

// ======================================================================= sections
// A section is a <details> built once and kept: only its summary line and body change, so the
// reader's open/closed choice survives the 1 s poll (and a reload, via localStorage). A closed
// section's body is not rendered at all.
const lastHtml = new WeakMap();
function setHtml(el, html) { if (lastHtml.get(el) !== html) { el.innerHTML = html; lastHtml.set(el, html); } }
function sec(id, title, parent, {open = false, skeleton = ''} = {}) {
  let d = document.getElementById(id);
  if (!d) {
    d = document.createElement('details');
    d.className = 'sec'; d.id = id;
    d.innerHTML = `<summary><span class="title">${esc(title)}</span><span class="sum"></span></summary><div class="body">${skeleton}</div>`;
    let saved = null;
    try { saved = localStorage.getItem('jev-open:' + id); } catch (e) { /* storage blocked */ }
    d.open = saved === null ? open : saved === '1';
    d.addEventListener('toggle', () => {
      try { localStorage.setItem('jev-open:' + id, d.open ? '1' : '0'); } catch (e) { /* storage blocked */ }
      if (d.open) render(true);
    });
    parent.appendChild(d);
  }
  return d;
}
const sumOf = (d) => d.querySelector(':scope > summary .sum');
const bodyOf = (d) => d.querySelector(':scope > .body');

// ======================================================================= status: summary bar, fleets, app, servers
const LEVEL = [['good', 'OK', '●'], ['warning', 'Warning', '▲'], ['critical', 'Error', '■'], ['muted', 'Stale', '○']];
const lvl = (d) => LEVEL[Math.min(3, Number(d.level) || 0)];
const numeric = (a, b) => a.localeCompare(b, undefined, {numeric: true});
const byName = (a, b) => numeric(a.name, b.name);

// Servers (they report a breaker), fleets (3+ statuses with the same keys, e.g. drones: one
// table) and everything else the app publishes (one section each).
function classify(diags) {
  const servers = [], groups = new Map(), apps = [], fleets = [];
  for (const d of diags) {
    if ('breaker' in (d.values || {})) { servers.push(d); continue; }
    const sig = Object.keys(d.values || {}).sort().join('|');
    if (!groups.has(sig)) groups.set(sig, []);
    groups.get(sig).push(d);
  }
  for (const [sig, g] of groups) (sig && g.length >= 3 ? fleets.push(g.sort(byName)) : apps.push(...g));
  return {servers: servers.sort(byName), fleets, apps: apps.sort(byName)};
}

// the app pins statuses to the bar with the dashboard's `summary` parameter
function renderSummary(servers) {
  const D = S.data || {}, pins = (D.summary || []).map((n) => (D.diagnostics || {})[n]).filter(Boolean);
  const ok = servers.filter((d) => !(Number(d.level) > 0)).length;
  const spend = servers.reduce((a, d) => a + (parseFloat(d.values.usd_last_hour) || 0), 0);
  setHtml($('summary'), pins.map((d) => `<span class="pill"><b>${esc(d.name.replace(/_/g, ' '))}</b>${esc(d.message)}</span>`).join('') +
    (servers.length ? `<span class="pill"><b>servers</b>${ok}/${servers.length} ok · ${usd(spend)}/h</span>` : ''));
}

// a value that starts with a percentage gets a small bar (e.g. a drone's energy)
function cell(v) {
  const m = /^(\d+(?:\.\d+)?)%/.exec(v || '');
  if (!m) return esc(v);
  const p = +m[1], c = p < 25 ? 'critical' : p < 50 ? 'warning' : 'good';
  return `<span class="ebar"><i style="width:${Math.min(100, p)}%;background:var(--${c})"></i></span>${esc(v)}`;
}
function renderFleets(fleets) {
  fleets.forEach((g) => {
    const base = g[0].name.replace(/\d+$/, '') || 'group';
    const d = sec('sec-fleet-' + base, `${base} ×${g.length}`, $('s-fleet'), {open: true});
    const n = [0, 0, 0, 0];
    g.forEach((x) => n[Math.min(3, Number(x.level) || 0)]++);
    sumOf(d).textContent = LEVEL.map(([, l], i) => n[i] ? `${n[i]} ${l.toLowerCase()}` : '').filter(Boolean).join(' · ') +
      ' · click a row for its decisions';
    if (!d.open) return;
    const keys = Object.keys(g[0].values || {});
    setHtml(bodyOf(d), `<div class="scroll-x"><table><thead><tr><th>name</th><th>doing</th>${keys.map((k) => `<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>
      ${g.map((x) => { const l = lvl(x); return `<tr class="click ${S.agent === '/' + x.name ? 'sel' : ''}" data-agent="/${esc(x.name)}">
        <th><span style="color:var(--${l[0]})" aria-label="${l[1]}">${l[2]}</span> ${esc(x.name)}</th><td>${esc(x.message)}</td>
        ${keys.map((k) => `<td>${cell(x.values[k])}</td>`).join('')}</tr>`; }).join('')}</tbody></table></div>`);
  });
}
function renderApps(apps) {
  apps.forEach((x) => {
    const d = sec('sec-app-' + x.name.replace(/\W+/g, '-'), x.name.replace(/_/g, ' '), $('s-apps'));
    const l = lvl(x);
    sumOf(d).innerHTML = `<span style="color:var(--${l[0]})">${l[2]}</span> ${esc(x.message)}`;
    if (!d.open) return;
    const rows = Object.entries(x.values || {});
    setHtml(bodyOf(d), rows.length ? `<div class="scroll-x"><table><tbody>${rows.map(([k, v]) =>
      `<tr><th>${esc(k)}</th><td>${cell(v)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No values.</div>');
  });
}
function renderServers(servers) {
  const d = sec('sec-servers', 'Servers', $('s-fixed'));
  sumOf(d).textContent = servers.map((x) => `${x.name} ${ms(+x.values.latency_ms_p50)}`).join(' · ') || 'none reporting';
  if (!d.open) return;
  setHtml(bodyOf(d), `<div class="grid health">${servers.map((x) => {
    const v = x.values, l = lvl(x), spent = parseFloat(v.usd_last_hour);
    return `<div class="panel"><div style="display:flex;align-items:center;gap:8px"><span style="color:var(--${l[0]})" aria-hidden="true">${l[2]}</span>
        <h3 class="mono">${esc(x.name)}</h3><span class="spacer"></span><span class="badge">${l[1]}</span></div>
      <div class="muted" style="font-size:12.5px">${esc(x.message)}</div>
      <dl class="kv">
        ${v.backend ? `<dt>backend</dt><dd>${esc(v.backend)} ${v.model ? '· ' + esc(v.model) : ''}</dd>` : ''}
        <dt>breaker</dt><dd>${esc(String(v.breaker).replace('_', '-'))}</dd>
        ${v.latency_ms_p50 ? `<dt>latency</dt><dd>p50 ${ms(+v.latency_ms_p50)} · p95 ${ms(+v.latency_ms_p95)}</dd>` : ''}
        ${v.calls ? `<dt>calls</dt><dd>${esc(v.calls)} · ${esc(v.errors || 0)} errors</dd>` : ''}
        ${v.last_error ? `<dt>last error</dt><dd>${esc(v.last_error)}</dd>` : ''}
        ${isFinite(spent) ? `<dt>spend</dt><dd>${usd(spent)} last hour</dd>` : ''}
      </dl></div>`; }).join('')}</div>`);
}

// ======================================================================= comms (hierarchy traffic)
// The server matches each Directive/Report across topics: a copy on a relay's far side is a
// delivery, a missing copy a drop (viz/traffic.py). Times are the sender's clock from the first message.
const DIR_LABEL = {down: 'Orders ↓ (directives)', up: 'Reports ↑'};
const LINK_LABEL = {ok: 'Delivered', lost: 'Dropped', pending: 'In flight', sent: 'No relay seen'};
const mmss = (s) => isNum(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '–';
const rateColor = (r) => r >= 0.9 ? 'good' : r >= 0.7 ? 'warning' : 'critical';
const pairName = (p, many) => many ? `${p.supervisor} ⇄ ${p.worker}` : p.worker;

function delivered(c) {
  const done = c.ok + c.lost, r = done ? c.ok / done : null;
  if (!c.sent) return '<span class="muted">–</span>';
  return (isNum(r) ? `<span class="ebar"><i style="width:${r * 100}%;background:var(--${rateColor(r)})"></i></span>` : '') +
    `${c.ok}/${c.sent}` + (c.pending ? ` <span class="muted">(${c.pending} in flight)</span>` : '');
}

// One row per link: orders grow up from the midline, reports down; dropped ones in red at the tip.
function swimlanes(el, pairs, tl, many) {
  const W = width(el), L = many ? 190 : 70, R = 8, rowH = 34, T = 4, B = 20, H = T + pairs.length * rowH + B;
  const bw = (W - L - R) / tl.buckets, span = tl.t1 - tl.t0, half = rowH / 2 - 3;
  const peak = (keys) => Math.max(1, ...pairs.flatMap((p) => p.lanes[keys[0]].map((v, i) => v + p.lanes[keys[1]][i])));
  const kDown = half / peak(['down', 'down_lost']), kUp = half / peak(['up', 'up_lost']);
  let s = '';
  pairs.forEach((p, r) => {
    const mid = T + r * rowH + rowH / 2, ln = p.lanes;
    s += `<text class="lbl" x="${L - 8}" y="${mid + 4}" text-anchor="end">${esc(pairName(p, many))}</text>` +
      `<line class="ax" x1="${L}" x2="${W - R}" y1="${mid}" y2="${mid}"/>`;
    for (let i = 0; i < tl.buckets; i++) {
      const x = L + i * bw + 0.5, w = Math.max(1, bw - 1);
      const dOk = ln.down[i] * kDown, dLost = ln.down_lost[i] * kDown, uOk = ln.up[i] * kUp, uLost = ln.up_lost[i] * kUp;
      if (dOk) s += `<rect x="${x}" y="${mid - dOk}" width="${w}" height="${dOk}" fill="var(--c0)"/>`;
      if (dLost) s += `<rect x="${x}" y="${mid - dOk - dLost}" width="${w}" height="${dLost}" fill="var(--critical)"/>`;
      if (uOk) s += `<rect x="${x}" y="${mid}" width="${w}" height="${uOk}" fill="var(--c2)"/>`;
      if (uLost) s += `<rect x="${x}" y="${mid + uOk}" width="${w}" height="${uLost}" fill="var(--critical)"/>`;
      const n = ln.down[i] + ln.down_lost[i] + ln.up[i] + ln.up_lost[i];
      if (n) {
        const a = span * i / tl.buckets, b = span * (i + 1) / tl.buckets;
        s += `<rect class="hit" x="${x}" y="${mid - half}" width="${w}" height="${2 * half}" data-comms-agent="${esc(p.worker)}"
          data-tip="${esc(`${pairName(p, true)} · ${mmss(a)}–${mmss(b)}\norders ↓ ${ln.down[i] + ln.down_lost[i]} (${ln.down_lost[i]} dropped)\nreports ↑ ${ln.up[i] + ln.up_lost[i]} (${ln.up_lost[i]} dropped)\nclick: this link's messages`)}"/>`;
      }
    }
  });
  const yAx = T + pairs.length * rowH + 14;
  s += [0, 0.25, 0.5, 0.75, 1].map((f) => `<text x="${L + f * (W - L - R)}" y="${yAx}" text-anchor="${f === 0 ? 'start' : f === 1 ? 'end' : 'middle'}">${mmss(f * span)}</text>`).join('');
  setHtml(el, `<svg class="chart lanes" width="${W}" height="${H}" role="img" aria-label="Messages per link over time">${s}</svg>`);
}

function renderComms() {
  const T = S.data && S.data.traffic;
  if (!T) return;                                    // static reports carry no traffic
  const d = sec('sec-comms', 'Comms', $('s-fixed'), {skeleton: `
    <p class="sub">Every directive (supervisor → worker) and report (worker → supervisor) on the bus, matched across relays: a copy on the far side is a delivery, a missing one a drop. Click a lane or a row for that link's messages.</p>
    <div id="lanes"></div>
    <div id="lanes-legend"></div>
    <div class="qtitle" style="margin-top:14px">Links</div><div id="links" class="scroll-x"></div>
    <div class="qtitle" style="margin-top:14px">Messages</div>
    <div class="filters">
      <label class="status">Agent <select id="c-agent"></select></label>
      <label class="status">Direction <select id="c-dir"></select></label>
      <label class="status">Delivery <select id="c-status"></select></label>
      <label class="status">Kind <select id="c-kind"></select></label></div>
    <div id="msgs" class="scroll-x"></div>`});
  const pairs = T.pairs || [], msgs = T.messages || [];
  const sum = (dir, k) => pairs.reduce((a, p) => a + p[dir][k], 0);
  const lost = sum('down', 'lost') + sum('up', 'lost'), done = lost + sum('down', 'ok') + sum('up', 'ok');
  const lats = pairs.map((p) => p.latency_ms_p50).filter(isNum).sort((a, b) => a - b);
  sumOf(d).textContent = !pairs.length ? 'no directives or reports yet' :
    `orders ↓ ${sum('down', 'ok')}/${sum('down', 'sent')} delivered · reports ↑ ${sum('up', 'ok')}/${sum('up', 'sent')} · ` +
    `${lost} dropped${done ? ` (${pct(lost / done, 0)})` : ''}` + (lats.length ? ` · median latency ${ms(lats[lats.length >> 1])}` : '');
  if (!d.open) return;
  if (!pairs.length) { setHtml($('lanes'), '<div class="empty">No hierarchy traffic yet.</div>'); return; }
  const many = new Set(pairs.map((p) => p.supervisor)).size > 1;
  swimlanes($('lanes'), pairs, T.timeline, many);
  setHtml($('lanes-legend'), legend([['var(--c0)', 'orders ↓ delivered'], ['var(--c2)', 'reports ↑ delivered'], ['var(--critical)', 'dropped']]));
  setHtml($('links'), `<table><thead><tr><th>link</th><th>orders ↓ delivered</th><th>reports ↑ delivered</th><th class="n">dropped</th>
    <th class="n">latency p50</th><th class="n">last heard</th><th>last message</th></tr></thead><tbody>
    ${pairs.map((p) => { const l = p.down.lost + p.up.lost, n = l + p.down.ok + p.up.ok;
      return `<tr class="click ${S.cAgent === p.worker ? 'sel' : ''}" data-comms-agent="${esc(p.worker)}"><th>${esc(pairName(p, many))}</th>
      <td>${delivered(p.down)}</td><td>${delivered(p.up)}</td>
      <td class="n" style="color:var(--${!l ? 'ink-2' : l / n >= 0.3 ? 'critical' : 'warning'})">${l}${n ? ` · ${pct(l / n, 0)}` : ''}</td>
      <td class="n">${ms(p.latency_ms_p50)}</td><td class="n">${isNum(p.last_t) ? ago(T.timeline.t1 - p.last_t) + ' ago' : '–'}</td>
      <td>${esc(p.last)}</td></tr>`; }).join('')}</tbody></table>`);
  // messages: a broadcast is one row; with an agent picked, only that agent's copy counts
  const agents = [...new Set(pairs.flatMap((p) => [p.supervisor, p.worker]))].sort(numeric);
  setHtml($('c-agent'), options(agents, S.cAgent));
  setHtml($('c-dir'), options(['down', 'up'], S.cDir, DIR_LABEL));
  setHtml($('c-status'), options(['ok', 'lost', 'pending', 'sent'], S.cStatus, LINK_LABEL));
  setHtml($('c-kind'), options([...new Set(msgs.map((m) => m.kind))].sort(), S.cKind));
  const rows = [];
  for (const m of msgs) {
    if ((S.cDir && m.dir !== S.cDir) || (S.cKind && m.kind !== S.cKind)) continue;
    let to = m.to.length ? m.to : [[m.target && m.target !== '*' ? m.target : '*', 'sent', null]];
    if (S.cAgent && m.from !== S.cAgent) to = to.filter((x) => x[0] === S.cAgent);
    if (!to.length || (S.cStatus && !to.some((x) => x[1] === S.cStatus))) continue;
    rows.push([m, to]);
    if (rows.length >= 100) break;
  }
  const t0 = T.timeline.t0, mark = {ok: '✓', lost: '✗', pending: '…', sent: '–'};
  const one = ([, st, lat]) => `<span style="color:var(--${st === 'ok' ? 'good-text' : st === 'lost' ? 'critical' : 'muted'})">${mark[st]} ${st === 'ok' ? ms(lat) : esc(LINK_LABEL[st].toLowerCase())}</span>`;
  setHtml($('msgs'), !rows.length ? '<div class="empty">No messages match.</div>' :
    `<table><thead><tr><th class="n">time</th><th>from → to</th><th>kind</th><th>about</th><th>delivery</th><th>payload</th></tr></thead><tbody>
    ${rows.map(([m, to]) => { const by = {}; to.forEach((x) => { by[x[1]] = (by[x[1]] || 0) + 1; });
      return `<tr><td class="n">${mmss(m.t - t0)}</td>
      <td>${esc(m.from)} ${m.dir === 'down' ? '↓' : '↑'} ${to.length === 1 ? esc(to[0][0]) : `${to.length} agents`}</td>
      <td>${esc(m.kind)}</td><td>${esc(m.subject || (m.target === '*' ? 'broadcast' : ''))}</td>
      <td class="dl" data-tip="${esc(to.map((x) => `${x[0]}: ${LINK_LABEL[x[1]]}${isNum(x[2]) ? ' ' + ms(x[2]) : ''}`).join('\n'))}">${to.length === 1 ? one(to[0]) :
        Object.entries(by).map(([st, n]) => `<span style="color:var(--${st === 'ok' ? 'good-text' : st === 'lost' ? 'critical' : 'muted'})">${n} ${mark[st]}</span>`).join(' · ')}</td>
      <td class="pay mono" data-tip="${esc(m.payload)}">${esc(m.payload)}</td></tr>`; }).join('')}</tbody></table>`);
}

// ======================================================================= decisions
function nowRef(decs) {
  return S.live ? Date.now() / 1000 : Math.max(0, ...decs.map((d) => d.t1));
}
function selections(r) {
  const out = {};
  for (const q of r.questions || []) if (q.selected) out[q.question] = q.selected;
  return out;
}
const options = (vals, cur, labels = {}) => '<option value="">All</option>' + vals.map((v) =>
  `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(labels[v] || v)}</option>`).join('');

function renderDecisions() {
  const d = sec('sec-decisions', 'Decisions', $('s-fixed'), {skeleton: `
    <div class="filters">
      <label class="status">Agent <select id="f-agent"></select></label>
      <label class="status">Question set <select id="f-qs"></select></label>
      <label class="status">Outcome <select id="f-outcome"></select></label></div>
    <p class="sub">Newest on the right, one block per decision, coloured by how it ended. Click a block or a row to inspect it.</p>
    <div id="strip" class="strip"></div><div id="strip-legend" class="legend"></div>
    <div class="qtitle" style="margin-top:14px">Latest per agent and question set</div><div id="latest" class="scroll-x"></div>
    <div class="section hidden" id="detail-wrap"><div id="detail" class="panel"></div></div>`});
  const all = decisions((S.data && S.data.records) || []);
  const recent = all.slice(-200), asked = recent.filter((x) => x.records.some((r) => r.phase === 'PROVISIONAL'));
  const used = asked.filter((x) => x.outcome === 'KEPT' || x.outcome === 'REVISED').length;
  sumOf(d).textContent = !all.length ? 'none yet' : `${all.length} recent · last 200: LLM asked in ${pct(asked.length / recent.length, 0)}` +
    (asked.length ? `, its answer used in ${pct(used / asked.length, 0)} of those` : '');
  if (!d.open) return;
  const decs = all.filter((x) => (!S.qs || x.final.question_set === S.qs) && (!S.agent || x.final.agent === S.agent) &&
    (!S.outcome || x.outcome === S.outcome));
  setHtml($('f-agent'), options([...new Set(all.map((x) => x.final.agent))].sort(numeric), S.agent));
  setHtml($('f-qs'), options((S.data && S.data.metrics && S.data.metrics.question_sets) || [], S.qs));
  setHtml($('f-outcome'), options(OUTCOMES, S.outcome, OUTCOME_LABEL));
  if (!decs.length) {
    setHtml($('strip'), '<div class="empty">No decisions match.</div>');
    setHtml($('strip-legend'), ''); setHtml($('latest'), ''); $('detail-wrap').classList.add('hidden');
    return;
  }
  const now = nowRef(decs), last = decs.slice(-100);
  $('strip').innerHTML = last.map((x) => {
    const f = x.final, sel = Object.entries(selections(f)).map(([q, c]) => `${q}: ${c}`).join('\n');
    return `<button style="background:${oc(x.outcome)}" class="${S.pinned === x.key ? 'sel' : ''}" data-key="${esc(x.key)}"
      aria-label="${esc(f.agent + ' ' + x.outcome)}" data-tip="${esc(`${f.agent} · ${f.question_set} #${f.decision_id}\n${OUTCOME_LABEL[x.outcome]} · ${ago(now - x.t1)} ago\n${sel}`)}"></button>`;
  }).join('');
  const seen = new Set(last.map((x) => x.outcome));
  setHtml($('strip-legend'), legend(OUTCOMES.filter((o) => seen.has(o)).map((o) => [oc(o), OUTCOME_LABEL[o]])).replace(/^<div class="legend">|<\/div>$/g, ''));
  const latest = new Map();
  for (const x of decs) latest.set(x.final.agent + '|' + x.final.question_set, x);
  const keys = [...latest.keys()].sort(numeric);
  $('latest').innerHTML = `<table><thead><tr><th>agent</th><th>set</th><th>phase</th><th>selected</th><th>outcome</th><th class="n">age</th></tr></thead><tbody>
    ${keys.map((k) => { const x = latest.get(k), f = x.final; return `<tr class="click ${!S.pinned && S.sel === k ? 'sel' : ''}" data-card="${esc(k)}">
      <th>${esc(f.agent)}</th><td>${esc(f.question_set)}</td>
      <td><span class="badge" data-tip="${esc(PHASE_HELP[f.phase] || '')}"><i class="dot" style="background:${oc(f.phase)}"></i>${esc(f.phase)}</span></td>
      <td>${esc(Object.entries(selections(f)).map(([q, c]) => `${q}=${c}`).join(' · '))}</td>
      <td>${esc(OUTCOME_LABEL[x.outcome])}</td><td class="n">${ago(now - x.t1)}</td></tr>`; }).join('')}</tbody></table>`;
  const pinned = S.pinned && all.find((x) => x.key === S.pinned);
  renderDetail(pinned || (S.sel && latest.get(S.sel)), now);
}

function renderDetail(d, now) {
  $('detail-wrap').classList.toggle('hidden', !d);
  if (!d) return;
  const f = d.final;
  const path = d.records.map((r, i) => `${i ? '<span aria-hidden="true">→</span>' : ''}<span class="badge" data-tip="${esc(PHASE_HELP[r.phase] || '')}"><i class="dot" style="background:${oc(r.phase)}"></i>${esc(r.phase)}</span>${i ? `<span>+${(wall(r) - d.t0).toFixed(1)} s</span>` : ''}`).join(' ');
  let params = {};
  try { params = JSON.parse(f.llm_params || '{}'); } catch (e) { params = {}; }
  const llmRec = d.records.find((r) => r.llm_model) || f;
  $('detail').innerHTML = `
    <div class="detail-head"><h2>${esc(f.agent)} · ${esc(f.question_set)} · decision #${esc(f.decision_id)}</h2>
      <span class="chip">gen ${esc(f.generation)}</span><span class="chip">group ${esc(f.group || '–')}</span>
      <span class="spacer"></span><span class="muted" style="font-size:12px">${hhmmss(d.t1)} · ${ago(now - d.t1)} ago</span>
      ${S.pinned ? '<button class="chip" id="unpin" style="cursor:pointer;border:0">follow latest</button>' : ''}</div>
    <div class="path">${path}</div>
    <div class="qmeta">${(f.triggers || []).map((x) => `<span class="chip">trigger: ${esc(x)}</span>`).join('')}
      ${f.jev_model ? `<span class="chip">Jev ${esc(f.jev_model)} · ${ms(f.jev_latency_ms)}</span>` : ''}
      ${llmRec.llm_model ? `<span class="chip">LLM ${esc(llmRec.llm_model)} · ${ms(llmRec.llm_latency_ms)} · ${usd(llmRec.cost_usd)}</span>` : '<span class="chip">no LLM answer</span>'}</div>
    ${legend([[css('jev'), 'Jev p'], [css('llm'), 'LLM q'], [css('fused'), 'Fused (softmax of logits)']])}
    <div class="grid qgrid">${(f.questions || []).map(questionBlock).join('')}</div>
    ${f.llm_rationale || (f.llm_flags || []).length || Object.keys(params).length ? `<div class="rationale">
      ${f.llm_rationale ? `<div><b>LLM rationale.</b> ${esc(f.llm_rationale)}</div>` : ''}
      ${(f.llm_flags || []).length ? `<div style="margin-top:4px">${f.llm_flags.map((x) => `<span class="badge">⚑ ${esc(x)}</span>`).join(' ')}</div>` : ''}
      ${Object.keys(params).length ? `<div class="mono" style="margin-top:4px">params ${esc(JSON.stringify(params))}</div>` : ''}</div>` : ''}
    ${(f.state || []).length ? `<div class="qtitle" style="margin-top:12px">State</div><div class="scroll-x"><table><tbody>${f.state.map((kv) => `<tr><th>${esc(kv.key)}</th><td>${esc(kv.value)}</td></tr>`).join('')}</tbody></table></div>` : ''}`;
  const up = $('unpin');
  if (up) up.onclick = () => { S.pinned = null; render(false); };
}

function questionBlock(q) {
  const p = q.p_jev || [], ql = q.q_llm || [], fz = (q.logits || []).length ? softmax(q.logits) : [];
  const ps = p.reduce((a, b) => a + (b || 0), 0) || 1, qs = ql.reduce((a, b) => a + (b || 0), 0) || 1;
  const jevTop = argmax(p);
  const bar = (v, c, name) => isNum(v) ? `<div class="bar" data-tip="${esc(name)}: ${pct(v)}"><i style="width:${Math.max(0.5, v * 78)}%;background:${css(c)}"></i>${pct(v, 0)}</div>`
    : '<div class="bar none"><i></i><span class="muted">–</span></div>';
  const rows = (q.classes || []).map((c, i) => {
    const masked = (q.masked || [])[i], marks = [];
    if (q.selected === c) marks.push('<span class="badge" style="background:var(--accent);color:#fff">✓ selected</span>');
    if (q.required === c) marks.push('<span class="badge">required</span>');
    if (masked) marks.push('<span class="badge">masked</span>');
    if (i === jevTop) marks.push('<span class="chip" data-tip="Jev\'s top class">Jev top</span>');
    return `<div class="crow"><div class="cname ${masked ? 'masked' : ''}">${esc(c)}<div class="marks">${marks.join('')}</div></div>
      <div class="bars">${bar(p.length ? p[i] / ps : null, 'jev', 'Jev')}${ql.length ? bar(ql[i] / qs, 'llm', 'LLM') : ''}${bar(fz.length ? fz[i] : null, 'fused', 'Fused')}</div></div>`;
  }).join('');
  const chips = [
    `<span class="chip" data-tip="Jev confidence c = 1 − H(p)/log|A|">c ${fix(q.jev_confidence)}</span>`,
    `<span class="chip" data-tip="Effective LLM weight β (0 = no LLM influence)">β ${fix(q.beta)}</span>`,
    `<span class="chip" data-tip="Probability the sampler gave this pick (for off-policy evaluation)">propensity ${fix(q.propensity)}</span>`,
    `<span class="chip" data-tip="Temperature τ and status-quo bonus κ">τ ${fix(q.tau)} · κ ${fix(q.kappa)}</span>`,
    q.group_noise ? '<span class="chip" data-tip="Used the group\'s shared Gumbel noise (coupled with the fleet)">group noise</span>' : '',
    q.irreversible_path ? '<span class="badge" style="color:var(--critical)" data-tip="Chosen by the irreversible rule: Jev and the LLM both ranked it first">⚠ irreversible</span>' : '',
    ql.length && isNum(q.llm_age_s) && q.llm_age_s > 0 ? `<span class="chip">LLM age ${q.llm_age_s.toFixed(1)} s</span>` : '',
  ].join('');
  return `<div><h3>${esc(q.question)}</h3><div class="qmeta">${chips}</div>${rows}</div>`;
}

// ======================================================================= metrics tab
function section() {
  const M = S.data && S.data.metrics;
  if (!M) return null;
  return S.qs ? (M.by_question_set || {})[S.qs] : M.overall;
}
function kpi(key, value, ctx) {
  const h = help(key);
  return `<div class="panel kpi"><div class="label">${esc(h.label || key)} ${info(key)}</div>
    <div class="value">${value}</div><div class="ctx">${ctx || '&nbsp;'}</div></div>`;
}
function card(id, key, extra = '', wide = false) {
  const h = typeof key === 'string' ? help(key) : key;
  return `<div class="panel"${wide ? ' style="grid-column:1/-1"' : ''}><h2>${esc(h.label || key)} ${h.unit && h.unit !== '%' ? `<span class="muted" style="font-weight:400">(${esc(h.unit)})</span>` : ''}</h2>
    <p class="sub">${esc(h.desc || '')}</p>${extra}<div id="${id}"></div></div>`;
}

function renderMetrics() {
  const m = section();
  if (!m || !m.volume || !m.volume.decisions) {
    $('kpis').innerHTML = ''; $('charts').innerHTML = '<div class="panel empty">No decisions yet — metrics appear once records arrive.</div>';
    return;
  }
  const ph = m.phases, au = m.augmentation, pf = m.performance, oc_ = ph.outcomes;
  const augmented = (oc_.REVISED || 0) + (oc_.KEPT || 0);
  $('kpis').innerHTML = [
    kpi('volume.decisions_per_min', fix(m.volume.decisions_per_min, 1), `${compact(m.volume.decisions)} decisions · ${m.volume.agents} agents · ${ago(m.volume.span_s)}`),
    kpi('phases.revision_rate', pct(ph.revision_rate), `${oc_.REVISED || 0} of ${augmented} augmented decisions`),
    kpi('phases.fallback_rate', pct(ph.fallback_rate), `degraded (incl. LLM missing) ${pct(ph.degraded_rate)}`),
    kpi('augmentation.agreement', pct(au.agreement), `LLM answered ${pct(au.llm_share, 0)} of decisions`),
    kpi('augmentation.mean_abs_delta', fix(au.mean_abs_delta) + '<span class="ctx"> nats</span>', `bound B = 3.00 · argmax flipped ${pct(au.argmax_flip_rate, 0)}`),
    kpi('performance.usd_per_hour', usd(pf.usd_per_hour), `total ${usd(pf.cost_usd)}`),
    kpi('performance.jev_latency_ms', ms(pf.jev_latency_ms.p95), `p95 · p50 ${ms(pf.jev_latency_ms.p50)} · p99 ${ms(pf.jev_latency_ms.p99)}`),
    kpi('performance.llm_latency_ms', ms(pf.llm_latency_ms.p95), `p95 · p50 ${ms(pf.llm_latency_ms.p50)} · p99 ${ms(pf.llm_latency_ms.p99)}`),
  ].join('');

  const tot = Object.values(oc_).reduce((a, b) => a + b, 0);
  const outLegend = legend(OUTCOMES.filter((o) => oc_[o]).map((o) => [oc(o), `${OUTCOME_LABEL[o]} ${pct(oc_[o] / tot, 0)}`]));
  const cal = m.calibration;
  $('charts').innerHTML = [
    card('c-time', 'phases.over_time', outLegend),
    card('c-beta', 'augmentation.beta', `<div class="legend"><span>mean β ${fix(au.beta_mean)} · LLM changed the pick in ${pct(au.changed_selection_rate, 0)} of augmented decisions</span></div>`),
    card('c-conf', 'jev.confidence', `<div class="legend"><span>mean ${fix(m.jev.confidence_mean)} · Jev's first option on top ${pct(m.jev.first_option_rate, 0)} of the time</span></div>`),
    card('c-jlat', 'performance.jev_latency_ms'),
    card('c-llat', 'performance.llm_latency_ms'),
    card('c-cost', 'performance.cost_series'),
    card('c-prop', 'behaviour.propensity', `<div class="legend"><span>below 0.05: ${pct(m.behaviour.low_propensity_share)} · switches ${fix(m.behaviour.switch_rate)} per agent-minute · irreversible commits ${m.behaviour.irreversible}</span></div>`),
    card('c-coup', 'coupling.agreement'),
    card('c-q', {label: 'Per question', desc: 'What each question chose (share of decisions per class) and how Jev and the LLM behaved on it. Hover a segment or a meter for details.'}, '', true),
    card('c-cal', 'calibration', '', true),
  ].join('');

  stacked($('c-time'), ph.over_time);
  histogram($('c-beta'), au.beta, {color: css('llm'), fmtX: (v) => v.toFixed(1), empty: 'No LLM answers yet.', aria: 'LLM weight histogram'});
  histogram($('c-conf'), m.jev.confidence, {color: css('jev'), fmtX: (v) => v.toFixed(1), aria: 'Jev confidence histogram'});
  const jl = pf.jev_latency_ms, ll = pf.llm_latency_ms;
  histogram($('c-jlat'), jl.hist, {color: css('jev'), fmtX: (v) => Math.round(v), unit: ' ms', empty: 'No Jev calls yet.',
    markers: [{x: jl.p50, label: 'p50'}, {x: jl.p95, label: 'p95'}]});
  histogram($('c-llat'), ll.hist, {color: css('llm'), fmtX: (v) => (v / 1000).toFixed(1) + ' s', unit: '', empty: 'No LLM calls yet.',
    markers: [{x: ll.p50, label: 'p50'}, {x: ll.p95, label: 'p95'}]});
  line($('c-cost'), pf.cost_series, {color: css('llm'), fmt: usd, label: 'spent', empty: 'No LLM spend yet.', aria: 'Cumulative LLM cost'});
  histogram($('c-prop'), m.behaviour.propensity, {color: css('fused'), fmtX: (v) => v.toFixed(2), empty: 'No sampled decisions yet.'});

  const bq = m.by_question || {};

  // coupling
  const cp = m.coupling;
  $('c-coup').innerHTML = cp.pairs ? hbars([
    {name: 'All pairs', value: cp.agreement, label: `${pct(cp.agreement, 0)} of ${cp.pairs}`, color: css('accent')},
    {name: 'Shared noise', value: cp.agreement_shared, label: `${pct(cp.agreement_shared, 0)} of ${cp.pairs_shared}`, tip: help('coupling.agreement_shared').desc, color: css('fused')},
    {name: 'Own noise', value: cp.agreement_independent, label: `${pct(cp.agreement_independent, 0)} of ${cp.pairs_independent}`, tip: help('coupling.agreement_independent').desc, color: css('jev')},
  ].map((r) => ({...r, value: r.value || 0})), 1) + `<div class="qtitle">By question</div>` + hbars(Object.entries(cp.by_question).map(([q, v]) => (
    {name: q, value: v.agreement || 0, label: `${pct(v.agreement, 0)} of ${v.pairs}`})), 1, css('accent'))
    : '<div class="empty">Needs two or more agents in the same group deciding in the same epoch.</div>';

  // per question: what it chose (one 100% bar) and how Jev and the LLM behaved on it (meters)
  const sw = m.behaviour.switch_rate_by_question || {};
  const swMax = Math.max(0.1, ...Object.values(sw).filter(isNum));
  const meter = (key, label, v, frac, fmt) => `<span class="meter" data-tip="${esc(help(key).desc || '')}">${esc(label)}
    <b><i style="width:${isNum(frac) ? Math.max(0, Math.min(1, frac)) * 100 : 0}%"></i></b>${fmt(v)}</span>`;
  const qrow = ([q, s]) => {
    // colour by catalog position, so a class keeps its colour whether or not the others occur
    const sel = Object.entries(s.selection || {}).map(([c, n], i) => [c, n, css('c' + (i % 8))]).filter(([, n]) => n);
    const tot = sel.reduce((a, [, n]) => a + n, 0);
    const bar = tot ? `<div class="stack">${sel.map(([c, n, col]) => `<i style="flex:${n};background:${col}"
        data-tip="${esc(`${q} = ${c}: ${n} of ${tot} (${pct(n / tot, 0)})`)}">${n / tot >= 0.14 ? esc(c) : ''}</i>`).join('')}</div>
      <div class="legend">${sel.map(([c, n, col]) => `<span><i class="sw" style="background:${col}"></i>${esc(c)} ${pct(n / tot, 0)}</span>`).join('')}</div>`
      : '<div class="muted" style="font-size:12px">reports a value; selects no class</div>';
    return `<div class="qrow"><div><div class="cname">${esc(q)}</div><div class="muted" style="font-size:12px">${s.n} decisions</div></div>
      <div>${bar}<div class="meters">
        ${meter('augmentation.agreement', 'LLM agrees', s.agreement, s.agreement, (v) => pct(v, 0))}
        ${meter('augmentation.argmax_flip_rate', 'LLM flips', s.argmax_flip_rate, s.argmax_flip_rate, (v) => pct(v, 0))}
        ${meter('augmentation.mean_abs_delta', 'nudge', s.mean_abs_delta, s.mean_abs_delta / 3, (v) => fix(v) + ' nats')}
        ${meter('jev.first_option_rate', 'Jev 1st option', s.first_option_rate, s.first_option_rate, (v) => pct(v, 0))}
        ${meter('behaviour.switch_rate', 'switches', sw[q], sw[q] / swMax, (v) => fix(v) + '/min')}</div></div></div>`;
  };
  // busiest first; generated sets (e.g. one fit question per drone x sector) go behind a dropdown
  const qs = Object.entries(bq).sort((a, b) => b[1].n - a[1].n), TOP = 12;
  $('c-q').innerHTML = (qs.length ? qs.slice(0, TOP).map(qrow).join('') +
    (qs.length > TOP ? `<details class="more"><summary>${qs.length - TOP} more questions</summary>${qs.slice(TOP).map(qrow).join('')}</details>` : '')
    : '<div class="empty">No selections yet.</div>') +
    (Object.keys(m.behaviour.flags || {}).length ? `<div class="qtitle">LLM flags</div><div class="qmeta">${Object.entries(m.behaviour.flags).map(([k, v]) => `<span class="badge">⚑ ${esc(k)} · ${v}</span>`).join('')}</div>` : '');

  // calibration
  const ce = $('c-cal');
  if (!cal || !Object.keys(cal).length) {
    ce.innerHTML = `<div class="empty">No labels yet. Publish jev_ai_msgs/Label on <span class="mono">labels</span> (or pass <span class="mono">--labels labels.jsonl</span> to the report) to see how well Jev, the LLM and the fused result are calibrated.</div>`;
  } else {
    const qn = Object.keys(cal);
    ce.innerHTML = `<p class="sub">Each dot is a bin of decisions; on the grey diagonal a model is perfectly calibrated, above it under-confident, below it over-confident.</p><div class="grid qgrid">${qn.map((q, i) => `<div><h3>${esc(q)}</h3>
      ${legend(SOURCES.filter(([k]) => cal[q][k] && cal[q][k].n).map(([k, n, c]) => [css(c), `${n}: ECE ${fix(cal[q][k].ece, 3)} · NLL ${fix(cal[q][k].nll)} · n ${cal[q][k].n}`]))}
      <div id="rel-${i}" style="margin-top:6px"></div></div>`).join('')}</div>`;
    qn.forEach((q, i) => { const el = $('rel-' + i); el.innerHTML = reliability(el, cal[q]); });
  }
  S.metricsStamp = S.data.metrics.generated_at;
}

// ======================================================================= metrics section
function renderMetricsSec(force) {
  const d = sec('sec-metrics', 'Metrics', $('s-fixed'),
    {skeleton: '<div id="kpis" class="grid kpis"></div><div id="charts" class="grid cols-2 section"></div>'});
  const m = section();
  sumOf(d).textContent = m && m.volume && m.volume.decisions ? `${fix(m.volume.decisions_per_min, 1)} decisions/min · ` +
    `revised ${pct(m.phases.revision_rate)} · ${usd(m.performance.cost_usd)} spent` : 'no decisions yet';
  // charts are the heavy part: only while open, and only when the metrics changed
  if (d.open && (force || S.metricsStamp !== (S.data && S.data.metrics && S.data.metrics.generated_at))) renderMetrics();
}

// ======================================================================= shell: data, events
function renderStatus() {
  const D = S.data;
  if (S.live) {
    const age = (Date.now() - S.lastOk) / 1000, ok = S.lastOk && age < 5;
    $('status').innerHTML = `<i class="dot" style="background:var(--${ok ? 'good' : 'critical'})"></i>${ok ? 'Live' : 'Disconnected'}${S.lastOk ? ` · updated ${ago(age)} ago` : ''}${S.error && !ok ? ' · ' + esc(S.error) : ''}`;
  } else if (D) {
    $('status').innerHTML = `<i class="dot" style="background:var(--muted)"></i>Static report · generated ${esc(new Date((D.generated_at || 0) * 1000).toLocaleString())} · ${esc((D.metrics && D.metrics.overall.volume.records) || 0)} records · ages are relative to the last record`;
  }
}
function render(force) {
  // re-rendering a section empties it for a moment (charts measure their width mid-render), and the
  // browser clamps the scroll position meanwhile: put the reader back where they were
  const y = scrollY;
  renderStatus();
  const {servers, fleets, apps} = classify(Object.values((S.data && S.data.diagnostics) || {}));
  renderSummary(servers);
  renderFleets(fleets);
  renderApps(apps);
  renderComms();
  renderDecisions();
  renderServers(servers);
  renderMetricsSec(force);
  if (scrollY !== y) scrollTo(0, y);
}
document.addEventListener('change', (e) => {
  const c = {'c-agent': 'cAgent', 'c-dir': 'cDir', 'c-status': 'cStatus', 'c-kind': 'cKind'}[e.target.id];
  if (c) { S[c] = e.target.value; render(false); return; }
  const f = {'f-agent': 'agent', 'f-qs': 'qs', 'f-outcome': 'outcome'}[e.target.id];
  if (!f) return;
  S[f] = e.target.value; S.pinned = null; S.sel = null;
  render(true);
});
document.addEventListener('click', (e) => {
  const near = (el) => el.scrollIntoView({behavior: 'smooth', block: 'nearest'});
  const b = e.target.closest('#strip button[data-key]');
  if (b) { S.pinned = b.dataset.key; render(false); near($('detail-wrap')); return; }
  const ca = e.target.closest('[data-comms-agent]');    // a comms lane or link row: its messages
  if (ca) { S.cAgent = S.cAgent === ca.dataset.commsAgent ? '' : ca.dataset.commsAgent; render(false); near($('msgs')); return; }
  const c = e.target.closest('tr[data-card]');
  if (c) { S.sel = c.dataset.card; S.pinned = null; render(false); near($('detail-wrap')); return; }
  const a = e.target.closest('tr[data-agent]');   // a fleet row: that agent's decisions
  if (a) {
    S.agent = S.agent === a.dataset.agent ? '' : a.dataset.agent; S.sel = null; S.pinned = null;
    const ds = $('sec-decisions');
    ds.open = true; render(true);
    ds.scrollIntoView({behavior: 'smooth', block: 'start'});
  }
});
let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => $('sec-metrics') && $('sec-metrics').open && renderMetrics(), 150);
});

async function poll() {
  try {
    const r = await fetch('api/state', {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    S.data = await r.json(); S.lastOk = Date.now(); S.error = '';
    render(false);
  } catch (e) { S.error = e.message; renderStatus(); }
  setTimeout(poll, 1000);
}

(function start() {
  const embedded = JSON.parse($('jev-data').textContent);
  if (embedded) { S.data = embedded; render(true); }
  else { S.live = true; renderStatus(); poll(); setInterval(renderStatus, 1000); }
})();
</script>
</body>
</html>

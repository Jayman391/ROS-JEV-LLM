# toy_patrol overrides of jev_ai_bringup/config/params.yaml: keyless mock backends with a
# state-aware Jev mock, a little Jev first-option bias, and a cassette-free logger path.
jev_server:
  ros__parameters:
    mock:
      seed: 7
      first_bias: 0.1
      latency_s: 0.05
      rules: jev_ai_examples.mock_rules:patrol

llm_server:
  ros__parameters:
    mock:
      seed: 7
      disagreement: 0.35
      latency_s: 0.8

decision_logger:
  ros__parameters:
    path: /tmp/jev_ai/toy_patrol.jsonl

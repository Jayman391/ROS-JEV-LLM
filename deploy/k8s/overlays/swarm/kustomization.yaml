# Drone swarm (Part B) on Kubernetes: the jev_ai framework + Gazebo + N drones (keyless mocks).
#
#   docker build -f deploy/docker/Dockerfile.swarm -t jev-ai-swarm:humble .   # after jev-ai:humble
#   kubectl apply -k deploy/k8s/overlays/swarm
#   kubectl -n jev-ai port-forward svc/dashboard 8080      # decisions + swarm status
#   kubectl -n jev-ai port-forward svc/sim 6081:6080       # Gazebo: http://localhost:6081/vnc.html
#   kubectl -n jev-ai logs deploy/sim | grep noVNC         # its password
#   kubectl delete -k deploy/k8s/overlays/swarm
#
# Other N workers: set NUM_DRONES=N below and `replicas: N + N/4` (the relays; the `replicas:`
# block), then apply again
# (the sim pod regenerates the world for N; the mission restarts).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - swarm.yaml
configMapGenerator:
  - name: jev-ai-env
    behavior: merge
    literals:
      - JEV_BACKEND=mock
      - LLM_BACKEND=mock
      - PARAMS_FILE=/ws/install/share/drone_swarm/config/swarm_params.yaml
      - RUN_ID=swarm-k8s
      - NUM_DRONES=8
      - SEED=0
      - SCENARIO=/ws/install/share/drone_swarm/config/scenario.yaml
replicas:
  - name: uav
    count: 10                # 8 workers + 2 relays
images:
  - name: jev-ai                     # every pod: jev_server imports the swarm's mock rules
    newName: jev-ai-swarm
    newTag: humble

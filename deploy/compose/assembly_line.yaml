# Assembly line on compose: the jev_ai services + line_sim + 5 arms + QA + supervisor, one
# container per node.
#
#   docker build -f deploy/docker/Dockerfile -t jev-ai:humble .
#   docker build -f deploy/docker/Dockerfile.assembly_line -t jev-ai-line:humble .
#   docker compose -f deploy/compose/assembly_line.yaml up -d
#   # line view: http://localhost:6082/vnc.html (password: docker compose logs viz | grep noVNC)
#
#   # + the Gazebo puppet view (needs jev-ai-swarm:humble, the swarm's Gazebo image):
#   docker build -f deploy/docker/Dockerfile.assembly_line --build-arg BASE=jev-ai-swarm:humble \
#     -t jev-ai-line-gz:humble .
#   docker compose -f deploy/compose/assembly_line.yaml --profile gazebo up -d
#   # Gazebo: http://localhost:6083/vnc.html (password: docker compose logs gazebo | grep noVNC)
#   # decisions + line status: http://localhost:8080
#   docker compose -f deploy/compose/assembly_line.yaml down
#
# Keyless by default (assembly_line.env); live: JEV_BACKEND=typesafe LLM_BACKEND=anthropic with
# keys in the repo's .env.
name: jev_ai_line
include:
  - path: compose.yaml
    env_file: assembly_line.env

x-line: &line
  image: ${JEV_AI_IMAGE:-jev-ai-line:humble}
  restart: unless-stopped
  env_file:
    - path: ../../.env
      required: false
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  deploy:
    resources:
      limits: {cpus: '0.5', memory: 384M}

# Agents: sim time, one run_id, decision records on /decisions, hierarchy traffic on /line/*.
services:
  line_sim:                           # the world; owns /clock
    <<: *line
    command: ros2 run line_control line_sim --ros-args --params-file /ws/install/share/assembly_line/config/scenario.yaml -p seed:=${SEED:-0}
  line_scorer:
    <<: *line
    command: ros2 run assembly_line line_scorer --ros-args -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line} -p summary_path:=/records/episode.json
    volumes:
      - records:/records
  line_supervisor:
    <<: *line
    command: ros2 run assembly_line line_supervisor --ros-args -r __node:=line_supervisor -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  supervisor_llm:                     # the supervisor's own LLM server (Sonnet 5.5, effort medium)
    <<: *line
    command: ros2 run jev_ai_servers llm_server --ros-args -r __ns:=/line_supervisor --params-file /ws/install/share/assembly_line/config/line_params.yaml -p backend:=${LLM_BACKEND:-mock}
  qa_agent:
    <<: *line
    command: ros2 run assembly_line qa_agent --ros-args -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  arm_a:
    <<: *line
    command: ros2 run assembly_line arm_agent --ros-args -r __ns:=/arm_a -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  arm_b:
    <<: *line
    command: ros2 run assembly_line arm_agent --ros-args -r __ns:=/arm_b -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  arm_c:
    <<: *line
    command: ros2 run assembly_line arm_agent --ros-args -r __ns:=/arm_c -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  arm_d:
    <<: *line
    command: ros2 run assembly_line arm_agent --ros-args -r __ns:=/arm_d -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  arm_e:
    <<: *line
    command: ros2 run assembly_line arm_agent --ros-args -r __ns:=/arm_e -r decisions:=/decisions -r reports:=/line/reports -r directives:=/line/directives -p use_sim_time:=true -p seed:=${SEED:-0} -p run_id:=${RUN_ID:-line}
  viz:                                # RViz line view on noVNC
    <<: *line
    command: /gui.sh ros2 run rviz2 rviz2 -d /ws/install/share/assembly_line/config/line.rviz --ros-args -p use_sim_time:=true
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6082}:6080"
    deploy:
      resources:
        limits: {cpus: '2', memory: 1G}
  gazebo:                             # Gazebo server + GUI (noVNC) + line_gz in one container
    <<: *line
    profiles: [gazebo]
    image: ${JEV_AI_GZ_IMAGE:-jev-ai-line-gz:humble}
    command: /gui.sh ros2 launch assembly_line gazebo.launch.py
    ports:
      - "127.0.0.1:${GZ_NOVNC_PORT:-6083}:6080"
    deploy:
      resources:
        limits: {cpus: '4', memory: 3G}
